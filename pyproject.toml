[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nelm-learning"
version = "0.1.0"
description = "An auditable prototype for evidence-aware continual learning"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Anurag Dongare" }]
keywords = ["continual-learning", "online-learning", "meta-learning", "knowledge-graphs", "research"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]
dependencies = []

[project.scripts]
nelm-benchmark = "nelm.benchmark:main"

[tool.setuptools.packages.find]
include = ["nelm*"]
